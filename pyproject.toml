[project]
name = "easy_video_editor"
dynamic = ["version"]
description = "EVE turns raw gameplay recordings into short trailers for YouTube, Shorts, Reels and TikTok."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [{ name = "FilloPrinci" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
]
dependencies = [
    "pydantic>=2.8",
    "PySide6>=6.7",
]

[project.scripts]
eve = "easy_video_editor.cli.main:main"

[project.gui-scripts]
eve-gui = "easy_video_editor.ui.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/easy_video_editor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/easy_video_editor"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S602", "S604"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "easy_video_editor.core.*",
    "easy_video_editor.media.*",
    "easy_video_editor.analysis.*",
    "easy_video_editor.ai.*",
]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
qt_api = "pyside6"
