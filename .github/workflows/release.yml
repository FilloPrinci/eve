name: Release

# Builds the Windows zip, the Linux AppImage and the Linux installer archive, tests them (Fedora
# included) and publishes them with SHA256SUMS to a GitHub Release (a pre-release for versions such
# as 0.1.0a3 -> v0.1.0-alpha.3).
#
# Releasing is automatic: when a commit on main carries a version (src/easy_video_editor/__init__.py)
# that has no tag yet, that version is built, tested and published, and its tag is created. A v* tag
# pushed by hand, or a run from the Actions tab with a tag name, publishes too; a run from the
# Actions tab without a tag only builds (the files are kept as workflow artifacts).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create and publish, e.g. v0.1.0-alpha.1 (empty: build only)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide what to build and publish
        id: plan
        run: |
          tag=""; build=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag="${{ inputs.tag }}"; build=true
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"; build=true
          else
            tag=$(python3 packaging/tag_for_version.py)
            if [ -n "$tag" ] && [ -z "$(git ls-remote --tags origin "refs/tags/$tag")" ]; then
              echo "New version on main: releasing $tag"
              build=true
            else
              echo "Version ${tag:-(development)} is already released or not a release: nothing to do"
              tag=""
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04 # oldest supported glibc, so the AppImage runs on most distributions
            platform: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      QT_QPA_PLATFORM: offscreen
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 file \
            desktop-file-utils
      - run: uv sync --locked --no-dev --group release

      - name: Version
        id: version
        run: |
          VERSION=$(uv run python -c "import easy_video_editor as e; print(e.__version__)")
          if [ -n "$TAG" ]; then
            uv run python packaging/check_version.py "$TAG"
            VERSION="${TAG#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build with PyInstaller
        run: |
          uv run python packaging/make_icons.py build/icons
          uv run pyinstaller packaging/eve.spec --noconfirm --distpath dist --workpath build/pyi
          uv run python packaging/collect_licenses.py dist/EVE/licenses/python
          cp LICENSE README.md CHANGELOG.md packaging/THIRD_PARTY_NOTICES.md dist/EVE/

      - name: Bundle FFmpeg
        run: |
          if [ "${{ matrix.platform }}" = windows ]; then pattern='win64-gpl-[0-9.]+\.zip'; else pattern='linux64-gpl-[0-9.]+\.tar\.xz'; fi
          # BtbN re-uploads the "latest" builds daily: retry while assets are being replaced.
          for attempt in 1 2 3 4 5; do
            asset=$(gh api repos/BtbN/FFmpeg-Builds/releases/tags/latest --jq '.assets[].name' \
              | grep -E "^ffmpeg-n[0-9.]+-latest-$pattern$" | sort -V | tail -1) || true
            if [ -n "$asset" ] && gh release download latest --repo BtbN/FFmpeg-Builds \
                --pattern "$asset" --dir build/ffmpeg --clobber; then
              break
            fi
            echo "::warning::FFmpeg download failed (attempt $attempt), retrying in 60 s"
            asset=""
            sleep 60
          done
          test -n "$asset"
          echo "Using $asset"
          cd build/ffmpeg
          if [[ "$asset" == *.zip ]]; then 7z x -y "$asset" > /dev/null; else tar -xf "$asset"; fi
          folder="${asset%.zip}"; folder="${folder%.tar.xz}"
          mkdir -p ../../dist/EVE/bin ../../dist/EVE/licenses/ffmpeg
          cp "$folder"/bin/ffmpeg* "$folder"/bin/ffprobe* ../../dist/EVE/bin/
          cp "$folder"/LICENSE.txt ../../dist/EVE/licenses/ffmpeg/
          echo "$asset" > ../../dist/EVE/licenses/ffmpeg/BUILD.txt

      - name: Bundle libmpv (Windows)
        if: runner.os == 'Windows'
        run: |
          asset=$(gh api repos/zhongfly/mpv-winbuild/releases/latest --jq '.assets[].name' \
            | grep -E '^mpv-dev-x86_64-[0-9]{8}-git-[0-9a-f]+\.7z$' | head -1)
          test -n "$asset"
          echo "Using $asset"
          tag=$(gh api repos/zhongfly/mpv-winbuild/releases/latest --jq '.tag_name')
          gh release download "$tag" --repo zhongfly/mpv-winbuild --pattern "$asset" --dir build/mpv
          7z e -y -r "build/mpv/$asset" -obuild/mpv libmpv-2.dll > /dev/null
          cp build/mpv/libmpv-2.dll dist/EVE/
          mkdir -p dist/EVE/licenses/mpv && echo "$asset" > dist/EVE/licenses/mpv/BUILD.txt

      - name: Smoke test
        run: |
          EVE=dist/EVE/eve
          "$EVE" --version
          "$EVE" doctor | tee doctor.txt
          grep -q "\[OK  \] ffmpeg: .*dist" doctor.txt
          if [ "${{ runner.os }}" = Windows ]; then grep -q "\[OK  \] libmpv: .*libmpv-2.dll" doctor.txt; fi
          work=$(mktemp -d)
          dist/EVE/bin/ffmpeg -v error -f lavfi -i "testsrc2=s=640x360:r=25:d=12" \
            -f lavfi -i "sine=frequency=440:d=12" -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac "$work/clip.mp4"
          "$EVE" new "$work" --name Smoke
          "$EVE" import "$work/Smoke.eve" "$work/clip.mp4"
          "$EVE" analyze "$work/Smoke.eve"
          "$EVE" refine "$work/Smoke.eve"
          "$EVE" assemble "$work/Smoke.eve"
          "$EVE" render "$work/Smoke.eve" --draft
          ls "$work/Smoke.eve/exports"
          dist/EVE/eve-gui --smoke-test  # fails if an installed or bundled libmpv cannot be used

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p out
          (cd dist && 7z a -tzip -mx=7 "../out/EVE-${{ steps.version.outputs.version }}-windows-x64.zip" EVE > /dev/null)

      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        run: |
          mkdir -p AppDir/usr/lib out
          cp -r dist/EVE AppDir/usr/lib/eve
          cp packaging/AppRun AppDir/AppRun
          cp packaging/eve.desktop AppDir/eve.desktop
          cp build/icons/eve.png AppDir/eve.png
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool AppDir \
            "out/EVE-${{ steps.version.outputs.version }}-x86_64.AppImage"
          APPIMAGE_EXTRACT_AND_RUN=1 "out/EVE-${{ steps.version.outputs.version }}-x86_64.AppImage" cli --version

      - name: Package (Linux installer archive)
        if: runner.os == 'Linux'
        run: |
          # The same files as the AppImage, extracted, with install.sh for a per-user installation
          # that appears in the application menu (no root, no FUSE).
          name="EVE-${{ steps.version.outputs.version }}-linux-x64"
          mkdir -p "$name"
          cp -a AppDir "$name/app"
          cp packaging/linux/install.sh packaging/linux/uninstall.sh packaging/linux/README.txt "$name/"
          tar -czf "out/$name.tar.gz" "$name"
          # Install into a throw-away home and check what a desktop would see.
          export HOME="$PWD/home" XDG_DATA_HOME="$PWD/home/.local/share"
          "./$name/install.sh"
          desktop-file-validate "$XDG_DATA_HOME/applications/eve.desktop"
          "$HOME/.local/bin/eve" --version
          QT_QPA_PLATFORM=offscreen "$HOME/.local/bin/eve-gui" --smoke-test
          "$XDG_DATA_HOME/EVE/uninstall.sh"
          test ! -e "$XDG_DATA_HOME/EVE" && test ! -e "$HOME/.local/bin/eve"

      - name: Test the AppImage on Fedora
        if: runner.os == 'Linux'
        run: |
          set +e
          docker run --rm -v "$PWD/out:/out:ro" -v "$PWD/packaging:/packaging:ro" fedora:latest \
            sh /packaging/test_appimage.sh "/out/EVE-${{ steps.version.outputs.version }}-x86_64.AppImage" \
            > fedora.log 2>&1
          status=$?
          cat fedora.log
          if [ $status -ne 0 ]; then
            # The end of the log as one annotation (readable without access to the full log).
            echo "::error title=AppImage test on Fedora failed::$(tail -40 fedora.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          fi
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: eve-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create the release
        run: |
          cd out && sha256sum EVE-* > SHA256SUMS && cat SHA256SUMS && cd ..
          python3 packaging/release_notes.py "$TAG" > notes.md
          prerelease=""
          if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Created on the Releases page: attach the files and fill in the notes.
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --title "EVE ${TAG#v}" --notes-file notes.md $prerelease
          else
            # The tag is created on the commit that was built.
            gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "EVE ${TAG#v}" \
              --notes-file notes.md $prerelease
          fi
